<div class="flex flex-col gap-2 w-full">
    <label class="block text-sm font-semibold text-gray-700">
        {{ config().label | translate}}

        @if(config().required) {
            <span class="text-red-500">*</span>
        }
        @if (control().invalid && control().touched) {
            @if (control().hasError('required')) {
                <span class="text-xs text-red-600 font-normal italic">({{ config().errorMessage?.required | translate}})</span>
            }
            @if (control().hasError('pattern')) {
                <span class="text-xs text-red-600 font-normal italic">({{ config().errorMessage?.pattern | translate}})</span>
            }
        }
    </label>
    <input 
    type="email"
    [id]="config().name"
    [formControl]="control()"
    [placeholder]="config().placeholder | translate"
    class="w-full rounded-lg outline-none text-sm px-3.5 py-2 pl-2.5
           border text-gray-900 transition-all
           focus:ring-2 focus:ring-blue-100"
    [class.border-red-400]="control().invalid && control().touched"
    [class.border-slate-300]="!(control().invalid && control().touched)"
    >
    
        
    
</div>
