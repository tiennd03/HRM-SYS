<main class="min-h-full bg-gray-50 p-5 text-slate-800">
  <div class="mb-3 text-xs text-blue-700">
    <a routerLink="/employee" class="hover:underline">Nhân viên</a>
    <span class="px-1">›</span>
    <span>EMP0002 · Trần Thị Hà</span>
  </div>

  <div class="grid items-start gap-4 lg:grid-cols-[288px_minmax(0,1fr)]">
    <section class="rounded-[42px] border border-gray-200 bg-white px-4 py-6">
      <div class="flex flex-col items-center text-center">
        <div class="flex size-20 items-center justify-center rounded-full border border-blue-300 bg-blue-100 text-xs font-semibold text-blue-700">
          TH
        </div>
        <h1 class="mt-3 text-sm font-semibold">Trần Thị Hà</h1>
        <p class="mt-1 text-xs text-slate-600">EMP0002 · Chuyên viên Nhân sự</p>
        <span class="mt-1 rounded border border-green-300 bg-green-100 px-5 py-0.5 text-[10px] text-green-800">ACTIVE</span>
      </div>

      <dl class="mt-4 grid grid-cols-[100px_minmax(0,1fr)] gap-x-2 gap-y-3 text-[11px]">
        <dt class="text-slate-600">Phòng ban</dt>
        <dd class="font-medium">Phòng Nhân sự</dd>
        <dt class="text-slate-600">Email</dt>
        <dd class="break-all font-medium">ha.tran2&#64;company.vn</dd>
        <dt class="text-slate-600">Điện thoại</dt>
        <dd class="font-medium">0987 654 321</dd>
        <dt class="text-slate-600">Giới tính</dt>
        <dd class="font-medium">Nữ · 12/08/1994</dd>
        <dt class="text-slate-600">Ngày vào làm</dt>
        <dd class="font-medium">01/03/2021</dd>
        <dt class="text-slate-600">Lương</dt>
        <dd class="font-medium">18.000.000 VNĐ</dd>
      </dl>

      <div class="mt-4 flex gap-2">
        <button type="button" class="flex-1 rounded border border-slate-300 px-3 py-2 text-xs hover:bg-gray-50">✎ Sửa</button>
        <button type="button" class="flex-1 rounded border border-red-600 bg-red-600 px-3 py-2 text-xs font-semibold text-white hover:bg-red-700">▣ Xoá</button>
      </div>
    </section>

    <section class="min-h-[380px] rounded-[42px] border border-gray-200 bg-white p-4 sm:p-5">
      <div class="mb-3 flex flex-wrap gap-2" role="tablist" aria-label="Thông tin nhân viên">
        <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'attendance'" (click)="setActiveTab('attendance')"
          class="rounded border px-5 py-2 text-xs" [class.border-blue-600]="activeTab() === 'attendance'" [class.bg-blue-600]="activeTab() === 'attendance'" [class.text-white]="activeTab() === 'attendance'" [class.border-slate-300]="activeTab() !== 'attendance'">
          Chấm công
        </button>
        <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'leave'" (click)="setActiveTab('leave')"
          class="rounded border px-5 py-2 text-xs" [class.border-blue-600]="activeTab() === 'leave'" [class.bg-blue-600]="activeTab() === 'leave'" [class.text-white]="activeTab() === 'leave'" [class.border-slate-300]="activeTab() !== 'leave'">
          Nghỉ phép
        </button>
        <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'payroll'" (click)="setActiveTab('payroll')"
          class="rounded border px-5 py-2 text-xs" [class.border-blue-600]="activeTab() === 'payroll'" [class.bg-blue-600]="activeTab() === 'payroll'" [class.text-white]="activeTab() === 'payroll'" [class.border-slate-300]="activeTab() !== 'payroll'">
          Bảng lương
        </button>
      </div>

      <app-data-table
        [columns]="activeColumns"
        [data]="activeRows"
        [totalElements]="activeRows.length"
        [pageSize]="5"
      ></app-data-table>

      <p class="mt-4 text-[11px] text-blue-700">GET /api/v1/employees/&#123;id&#125;</p>
    </section>
  </div>
</main>
